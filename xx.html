<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İNVER вода | Pro Manager Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        :root { --primary: #00d2ff; --secondary: #3a7bd5; --dark: #050b18; }
        body { 
            font-family: 'Outfit', sans-serif; 
            background: radial-gradient(circle at top right, #1e293b, #050b18);
            color: #e2e8f0; min-height: 100vh; margin: 0; overflow-x: hidden;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .active-nav {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4); color: white !important;
        }
        .glow-text { text-shadow: 0 0 10px rgba(0, 210, 255, 0.5); }
        .pulse-red { animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .stat-card { background: rgba(255,255,255,0.03); border-left: 3px solid var(--primary); }
    </style>
</head>
<body class="pb-24">

    <!-- BİLDİRİM SİSTEMİ -->
    <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 z-[100] transition-all duration-500 opacity-0 pointer-events-none">
        <div id="toastContent" class="px-6 py-3 rounded-full font-bold shadow-2xl flex items-center gap-2"></div>
    </div>

    <!-- KRİTİK STOK UYARISI -->
    <div id="stockAlert" class="hidden bg-red-600 text-white text-center py-2 font-bold pulse-red sticky top-0 z-[60]">
        <i class="fas fa-exclamation-triangle mr-2"></i> DÜŞÜK STOK SEVİYESİ!
    </div>

    <header class="p-6 flex flex-col items-center">
        <h1 class="text-3xl font-extrabold tracking-tighter glow-text uppercase">İNVER <span class="text-cyan-400 font-light italic">вода</span></h1>
        <div id="dateDisplay" class="text-slate-400 text-[10px] mt-1 uppercase tracking-widest"></div>
    </header>

    <!-- ÜST ÖZET PANELİ -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 px-4 mb-6 max-w-5xl mx-auto">
        <div class="glass-card p-4 rounded-3xl text-center border-b-2 border-cyan-500">
            <p class="text-[10px] uppercase text-slate-400">Depo Suyu</p>
            <h3 id="dash-tank" class="text-lg font-bold">0 L</h3>
            <div class="w-full bg-slate-800 h-1 rounded-full mt-2 overflow-hidden">
                <div id="tankBar" class="bg-cyan-500 h-full transition-all duration-700"></div>
            </div>
        </div>
        <div class="glass-card p-4 rounded-3xl text-center border-b-2 border-green-500">
            <p class="text-[10px] uppercase text-slate-400">Bugün Nakit</p>
            <h3 id="dash-cash" class="text-lg font-bold text-green-400">0 ₴</h3>
        </div>
        <div class="glass-card p-4 rounded-3xl text-center border-b-2 border-orange-500">
            <p class="text-[10px] uppercase text-slate-400">Boş Şişe (5/10)</p>
            <h3 id="dash-bottles" class="text-lg font-bold text-orange-400">0/0</h3>
        </div>
        <div class="glass-card p-4 rounded-3xl text-center border-b-2 border-blue-500">
            <p class="text-[10px] uppercase text-slate-400">Bugün Kart</p>
            <h3 id="dash-bank" class="text-lg font-bold text-blue-400">0 ₴</h3>
        </div>
    </div>

    <main class="px-4 max-w-4xl mx-auto">
        
        <!-- SATIŞ EKRANI -->
        <section id="sales" class="content-section">
            <div class="glass-card p-6 rounded-[35px] border border-cyan-500/20">
                <div class="flex justify-between mb-4">
                    <h2 class="font-bold">Hızlı İşlem</h2>
                    <span class="text-cyan-400 text-xs">Su: <span id="unitPriceLabel">0</span> ₴/L</span>
                </div>
                <div class="grid grid-cols-3 gap-2 mb-4 text-white">
                    <button onclick="quickFill(5)" class="bg-slate-800 p-3 rounded-xl text-xs font-bold active:scale-95 transition">+5L</button>
                    <button onclick="quickFill(10)" class="bg-slate-800 p-3 rounded-xl text-xs font-bold active:scale-95 transition">+10L</button>
                    <button onclick="quickFill(19)" class="bg-slate-800 p-3 rounded-xl text-xs font-bold active:scale-95 transition">+19L</button>
                </div>
                <div class="space-y-4">
                    <div class="relative">
                        <input type="number" id="saleLiters" oninput="calculateSale()" class="w-full bg-slate-900/50 p-5 rounded-2xl border-2 border-slate-700 text-3xl font-bold focus:border-cyan-500 outline-none text-center" placeholder="0.0">
                        <span class="absolute right-6 top-1/2 -translate-y-1/2 text-slate-500 font-bold">LİTRE</span>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div class="bg-slate-800/40 p-3 rounded-2xl flex justify-between items-center">
                            <span class="text-[10px] text-slate-400 italic">5L Şişe Satışı</span>
                            <div class="flex items-center gap-3">
                                <button onclick="adjBottle('sale5L', -1)" class="text-cyan-500"><i class="fas fa-minus-circle"></i></button>
                                <input type="number" id="sale5L" oninput="calculateSale()" class="bg-transparent w-6 text-center font-bold" value="0">
                                <button onclick="adjBottle('sale5L', 1)" class="text-cyan-500"><i class="fas fa-plus-circle"></i></button>
                            </div>
                        </div>
                        <div class="bg-slate-800/40 p-3 rounded-2xl flex justify-between items-center">
                            <span class="text-[10px] text-slate-400 italic">10L Şişe Satışı</span>
                            <div class="flex items-center gap-3">
                                <button onclick="adjBottle('sale10L', -1)" class="text-cyan-500"><i class="fas fa-minus-circle"></i></button>
                                <input type="number" id="sale10L" oninput="calculateSale()" class="bg-transparent w-6 text-center font-bold" value="0">
                                <button onclick="adjBottle('sale10L', 1)" class="text-cyan-500"><i class="fas fa-plus-circle"></i></button>
                            </div>
                        </div>
                    </div>
                    <div class="p-4 bg-cyan-500/10 rounded-2xl border border-cyan-500/30 text-center">
                        <p class="text-[10px] text-cyan-300 uppercase tracking-tighter">Ödenecek Toplam</p>
                        <h3 id="totalPriceDisplay" class="text-4xl font-black">0.00 ₴</h3>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="completeSale('Nakit')" class="bg-green-600 hover:bg-green-500 p-4 rounded-xl font-bold shadow-lg transition-all">NAKİT ÖDEME</button>
                        <button onclick="completeSale('Kart')" class="bg-blue-600 hover:bg-blue-500 p-4 rounded-xl font-bold shadow-lg transition-all">KART ÖDEME</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- İSTATİSTİK & GRAFİK -->
        <section id="dashboard" class="content-section hidden space-y-4">
            <div class="glass-card p-6 rounded-[35px] h-72">
                <canvas id="mainChart"></canvas>
            </div>
            <div id="statCards" class="grid grid-cols-2 gap-3">
                <!-- JS ile dolacak -->
            </div>
        </section>

        <!-- GEÇMİŞ TABLOSU -->
        <section id="history" class="content-section hidden">
            <div class="glass-card rounded-[35px] overflow-hidden">
                <div class="p-5 border-b border-slate-800 flex justify-between items-center bg-slate-800/30">
                    <h2 class="font-bold">İşlem Kayıtları</h2>
                    <button onclick="downloadPDF()" class="bg-red-500/20 text-red-400 text-[10px] px-3 py-1 rounded-full border border-red-500/30 font-bold uppercase">Rapor (PDF)</button>
                </div>
                <div class="overflow-x-auto max-h-[450px]">
                    <table class="w-full text-[12px]">
                        <thead class="bg-slate-900 text-slate-500 uppercase">
                            <tr><th class="p-3 text-left">Zaman</th><th class="p-3 text-left">Detay</th><th class="p-3">Tür</th><th class="p-3 text-right">Tutar</th></tr>
                        </thead>
                        <tbody id="historyTable" class="divide-y divide-slate-800/50"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- AYARLAR & STOK YÖNETİMİ -->
        <section id="settings" class="content-section hidden">
            <div class="glass-card p-6 rounded-[35px] space-y-6">
                <div>
                    <h2 class="font-bold border-b border-slate-700 pb-2 mb-4 text-cyan-400">Fiyatlandırma Ayarları</h2>
                    <div class="grid grid-cols-3 gap-3">
                        <div class="space-y-1">
                            <label class="text-[9px] text-slate-400 uppercase">1L Su (₴)</label>
                            <input type="number" id="setPriceLitre" class="w-full bg-slate-800 p-3 rounded-xl border border-slate-700 focus:border-cyan-500 outline-none">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[9px] text-slate-400 uppercase">5L Şişe (₴)</label>
                            <input type="number" id="setPrice5L" class="w-full bg-slate-800 p-3 rounded-xl border border-slate-700 focus:border-cyan-500 outline-none">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[9px] text-slate-400 uppercase">10L Şişe (₴)</label>
                            <input type="number" id="setPrice10L" class="w-full bg-slate-800 p-3 rounded-xl border border-slate-700 focus:border-cyan-500 outline-none">
                        </div>
                    </div>
                </div>

                <div>
                    <h2 class="font-bold border-b border-slate-700 pb-2 mb-4 text-orange-400">Stok & Depo Girişi</h2>
                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <div class="space-y-1">
                            <label class="text-[9px] text-slate-400 uppercase">Depo Max Kapasite (L)</label>
                            <input type="number" id="setTankMax" class="w-full bg-slate-800 p-3 rounded-xl border border-slate-700 focus:border-cyan-500 outline-none">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[9px] text-slate-400 uppercase">Kritik Uyarı Sınırı (L)</label>
                            <input type="number" id="setTankLimit" class="w-full bg-slate-800 p-3 rounded-xl border border-slate-700 focus:border-cyan-500 outline-none">
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <div class="space-y-1">
                            <label class="text-[9px] text-cyan-400 uppercase">Su Ekle (L)</label>
                            <input type="number" id="addTankWater" class="w-full bg-slate-900 p-3 rounded-xl border border-cyan-900 placeholder-slate-600" placeholder="+0">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[9px] text-orange-400 uppercase">5L Boş Şişe</label>
                            <input type="number" id="addStock5L" class="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 placeholder-slate-600" placeholder="+0">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[9px] text-orange-400 uppercase">10L Boş Şişe</label>
                            <input type="number" id="addStock10L" class="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 placeholder-slate-600" placeholder="+0">
                        </div>
                    </div>
                </div>

                <button onclick="saveSettings()" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 p-4 rounded-2xl font-bold shadow-xl active:scale-95 transition-all uppercase tracking-widest">Verileri Kaydet ve Uygula</button>
                
                <div class="flex gap-4 pt-4">
                    <button onclick="clearAllData()" class="flex-1 text-red-500 text-[10px] uppercase font-bold opacity-50 hover:opacity-100 transition">Sistemi Sıfırla</button>
                    <span class="text-slate-600 text-[10px]">v3.2 Stable Build</span>
                </div>
            </div>
        </section>
    </main>

    <!-- ALT NAVİGASYON -->
    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[92%] max-w-md glass-card rounded-full p-2 flex justify-around items-center z-50">
        <button onclick="showSection('sales')" class="nav-btn active-nav w-12 h-12 rounded-full transition-all text-slate-400"><i class="fas fa-plus"></i></button>
        <button onclick="showSection('dashboard')" class="nav-btn w-12 h-12 rounded-full transition-all text-slate-400"><i class="fas fa-chart-line"></i></button>
        <button onclick="showSection('history')" class="nav-btn w-12 h-12 rounded-full transition-all text-slate-400"><i class="fas fa-history"></i></button>
        <button onclick="showSection('settings')" class="nav-btn w-12 h-12 rounded-full transition-all text-slate-400"><i class="fas fa-sliders-h"></i></button>
    </nav>

    <audio id="cashSound" src="https://assets.mixkit.co/active_storage/sfx/2017/2017-preview.mp3"></audio>

    <script>
        // VERİ TABANI YAPISI
        let db = JSON.parse(localStorage.getItem('inverDataV3_Final')) || {
            settings: { priceLitre: 5, price5L: 20, price10L: 35, tankLimit: 100, tankMax: 2000 },
            stock: { tankWater: 1500, bottles5L: 50, bottles10L: 30 },
            sales: []
        };

        function saveDB() {
            localStorage.setItem('inverDataV3_Final', JSON.stringify(db));
            renderUI();
        }

        // BİLDİRİM ARACI
        function notify(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const content = document.getElementById('toastContent');
            content.className = `px-6 py-3 rounded-full font-bold shadow-2xl flex items-center gap-2 ${type === 'success' ? 'bg-cyan-500 text-white' : 'bg-red-500 text-white'}`;
            content.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-times-circle'}"></i> ${msg}`;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 2000);
        }

        // SATIŞ HESAPLAMA
        function calculateSale() {
            const l = parseFloat(document.getElementById('saleLiters').value) || 0;
            const b5 = parseInt(document.getElementById('sale5L').value) || 0;
            const b10 = parseInt(document.getElementById('sale10L').value) || 0;
            
            const total = (l * db.settings.priceLitre) + (b5 * db.settings.price5L) + (b10 * db.settings.price10L);
            document.getElementById('totalPriceDisplay').innerText = total.toFixed(2) + ' ₴';
        }

        function quickFill(amt) {
            let val = parseFloat(document.getElementById('saleLiters').value) || 0;
            document.getElementById('saleLiters').value = val + amt;
            calculateSale();
        }

        function adjBottle(id, val) {
            let input = document.getElementById(id);
            let res = parseInt(input.value) + val;
            input.value = res < 0 ? 0 : res;
            calculateSale();
        }

        // SATIŞI TAMAMLA
        function completeSale(method) {
            const l = parseFloat(document.getElementById('saleLiters').value) || 0;
            const b5 = parseInt(document.getElementById('sale5L').value) || 0;
            const b10 = parseInt(document.getElementById('sale10L').value) || 0;

            if(l <= 0 && b5 <= 0 && b10 <= 0) return notify("Miktar girmelisiniz!", "error");
            if(db.stock.tankWater < l) return notify("Depoda yeterli su yok!", "error");
            if(db.stock.bottles5L < b5 || db.stock.bottles10L < b10) return notify("Yetersiz boş şişe!", "error");

            const total = (l * db.settings.priceLitre) + (b5 * db.settings.price5L) + (b10 * db.settings.price10L);

            db.sales.push({
                id: Date.now(),
                date: new Date().toISOString(),
                liters: l, b5, b10, total, method
            });

            db.stock.tankWater -= l;
            db.stock.bottles5L -= b5;
            db.stock.bottles10L -= b10;

            document.getElementById('cashSound').play();
            resetSaleForm();
            saveDB();
            notify("Satış Kaydedildi!");
        }

        function resetSaleForm() {
            document.getElementById('saleLiters').value = '';
            document.getElementById('sale5L').value = 0;
            document.getElementById('sale10L').value = 0;
            calculateSale();
        }

        // ARAYÜZ GÜNCELLEME
        function renderUI() {
            // Dashboard rakamları
            document.getElementById('dash-tank').innerText = Math.floor(db.stock.tankWater) + ' L';
            document.getElementById('dash-bottles').innerText = `${db.stock.bottles5L} / ${db.stock.bottles10L}`;
            
            const pct = (db.stock.tankWater / db.settings.tankMax) * 100;
            document.getElementById('tankBar').style.width = pct + '%';
            document.getElementById('stockAlert').classList.toggle('hidden', db.stock.tankWater >= db.settings.tankLimit);

            // Günlük ciro hesabı
            const today = new Date().toLocaleDateString();
            const todaySales = db.sales.filter(s => new Date(s.date).toLocaleDateString() === today);
            
            document.getElementById('dash-cash').innerText = todaySales.filter(s => s.method === 'Nakit').reduce((a,b) => a+b.total,0).toFixed(1) + ' ₴';
            document.getElementById('dash-bank').innerText = todaySales.filter(s => s.method === 'Kart').reduce((a,b) => a+b.total,0).toFixed(1) + ' ₴';
            
            // Ayarlar önizleme
            document.getElementById('unitPriceLabel').innerText = db.settings.priceLitre;
            
            // Ayarlar formu dolumu
            document.getElementById('setPriceLitre').value = db.settings.priceLitre;
            document.getElementById('setPrice5L').value = db.settings.price5L;
            document.getElementById('setPrice10L').value = db.settings.price10L;
            document.getElementById('setTankMax').value = db.settings.tankMax;
            document.getElementById('setTankLimit').value = db.settings.tankLimit;
        }

        // SEKMELER ARASI GEÇİŞ
        function showSection(id) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(b => {
                b.classList.remove('active-nav');
                b.classList.add('text-slate-400');
            });
            event.currentTarget.classList.add('active-nav');
            event.currentTarget.classList.remove('text-slate-400');

            if(id === 'dashboard') { renderChart(); updateStatCards(); }
            if(id === 'history') updateHistoryTable();
        }

        // GEÇMİŞ TABLOSU
        function updateHistoryTable() {
            const html = db.sales.slice().reverse().map(s => {
                let detail = `${s.liters}L Su`;
                if(s.b5 > 0) detail += ` + ${s.b5}x5L`;
                if(s.b10 > 0) detail += ` + ${s.b10}x10L`;

                return `
                    <tr class="hover:bg-white/5 transition-colors">
                        <td class="p-3 text-slate-500">${new Date(s.date).toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'})}</td>
                        <td class="p-3 font-semibold text-slate-200">${detail}</td>
                        <td class="p-3 text-center"><span class="px-2 py-0.5 rounded-md text-[8px] font-bold ${s.method === 'Nakit' ? 'bg-green-500/20 text-green-400' : 'bg-blue-500/20 text-blue-400'}">${s.method.toUpperCase()}</span></td>
                        <td class="p-3 text-right font-black text-cyan-400">${s.total.toFixed(1)} ₴</td>
                    </tr>
                `;
            }).join('');
            document.getElementById('historyTable').innerHTML = html || '<tr><td colspan="4" class="p-10 text-center text-slate-600 italic text-xs">Henüz işlem kaydı bulunmuyor.</td></tr>';
        }

        // İSTATİSTİK KARTLARI
        function updateStatCards() {
            const totalLiters = db.sales.reduce((a,b) => a+b.liters, 0);
            const totalRevenue = db.sales.reduce((a,b) => a+b.total, 0);
            const total5L = db.sales.reduce((a,b) => a+b.b5, 0);
            const total10L = db.sales.reduce((a,b) => a+b.b10, 0);

            const stats = [
                { label: 'Toplam Satış', val: totalRevenue.toFixed(0) + ' ₴', icon: 'fa-wallet' },
                { label: 'Toplam Su', val: totalLiters.toFixed(0) + ' L', icon: 'fa-tint' },
                { label: 'Toplam 5L Şişe', val: total5L + ' Adet', icon: 'fa-box' },
                { label: 'Toplam 10L Şişe', val: total10L + ' Adet', icon: 'fa-box-open' }
            ];

            document.getElementById('statCards').innerHTML = stats.map(s => `
                <div class="glass-card p-4 rounded-2xl flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-cyan-500/10 flex items-center justify-center text-cyan-400">
                        <i class="fas ${s.icon}"></i>
                    </div>
                    <div>
                        <p class="text-[9px] text-slate-500 uppercase">${s.label}</p>
                        <p class="text-sm font-bold">${s.val}</p>
                    </div>
                </div>
            `).join('');
        }

        // AYARLARI KAYDET
        function saveSettings() {
            db.settings.priceLitre = parseFloat(document.getElementById('setPriceLitre').value) || db.settings.priceLitre;
            db.settings.price5L = parseFloat(document.getElementById('setPrice5L').value) || db.settings.price5L;
            db.settings.price10L = parseFloat(document.getElementById('setPrice10L').value) || db.settings.price10L;
            db.settings.tankMax = parseFloat(document.getElementById('setTankMax').value) || db.settings.tankMax;
            db.settings.tankLimit = parseFloat(document.getElementById('setTankLimit').value) || db.settings.tankLimit;
            
            // Stok eklemeleri
            db.stock.tankWater += parseFloat(document.getElementById('addTankWater').value) || 0;
            db.stock.bottles5L += parseInt(document.getElementById('addStock5L').value) || 0;
            db.stock.bottles10L += parseInt(document.getElementById('addStock10L').value) || 0;

            // Formu temizle
            ['addTankWater', 'addStock5L', 'addStock10L'].forEach(id => document.getElementById(id).value = '');
            
            saveDB();
            notify("Tüm ayarlar başarıyla kaydedildi!");
        }

        // GRAFİK SİSTEMİ
        let mainChart;
        function renderChart() {
            const ctx = document.getElementById('mainChart').getContext('2d');
            if(mainChart) mainChart.destroy();
            
            const last7Days = [...Array(7)].map((_, i) => {
                const d = new Date(); d.setDate(d.getDate() - i); return d.toLocaleDateString('tr-TR');
            }).reverse();

            const chartData = last7Days.map(day => 
                db.sales.filter(s => new Date(s.date).toLocaleDateString('tr-TR') === day).reduce((a,b) => a+b.liters, 0)
            );

            mainChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: last7Days.map(d => d.slice(0, 5)),
                    datasets: [{
                        label: 'Litre', data: chartData, borderColor: '#00d2ff', borderWidth: 3, 
                        backgroundColor: 'rgba(0, 210, 255, 0.1)', fill: true, tension: 0.4, pointRadius: 2
                    }]
                },
                options: { 
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { 
                        y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b', font: { size: 10 } } },
                        x: { grid: { display: false }, ticks: { color: '#64748b', font: { size: 10 } } }
                    }
                }
            });
        }

        // PDF ÇIKTISI
        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(18); doc.text("INVER WATER - SATIS RAPORU", 10, 20);
            doc.setFontSize(10);
            doc.text(`Rapor Tarihi: ${new Date().toLocaleString('tr-TR')}`, 10, 30);
            
            let y = 40;
            doc.text("TARIH          LITRE     TUTAR     TUR", 10, y);
            doc.line(10, y+2, 200, y+2);
            
            db.sales.slice(-25).reverse().forEach((s, i) => {
                y += 10;
                const dateStr = new Date(s.date).toLocaleString('tr-TR').slice(0,16);
                doc.text(`${dateStr}   ${s.liters}L       ${s.total} UAH    ${s.method}`, 10, y);
            });
            
            doc.save(`inver_rapor_${Date.now()}.pdf`);
            notify("PDF Dosyası İndirildi");
        }

        function clearAllData() {
            if(confirm("Tüm satış verileri ve ayarlar kalıcı olarak silinecektir. Emin misiniz?")) {
                localStorage.removeItem('inverDataV3_Final');
                location.reload();
            }
        }

        // SAAT GÜNCELLEME
        setInterval(() => {
            const opt = { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit', second: '2-digit' };
            document.getElementById('dateDisplay').innerText = new Date().toLocaleDateString('tr-TR', opt);
        }, 1000);

        // İLK ÇALIŞTIRMA
        renderUI();
    </script>
</body>
</html>
