<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>İNVER вода | Cloud Elite v9.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        :root { --primary: #00d2ff; --secondary: #3a7bd5; --dark: #050b18; }
        body { 
            font-family: 'Outfit', sans-serif; 
            background: radial-gradient(circle at top right, #1e293b, #050b18);
            color: #e2e8f0; min-height: 100vh; margin: 0; overflow-x: hidden;
        }
        .glass-card { background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .active-nav { background: linear-gradient(135deg, var(--primary), var(--secondary)); box-shadow: 0 0 20px rgba(0, 210, 255, 0.5); color: white !important; }
        .glow-text { text-shadow: 0 0 15px rgba(0, 210, 255, 0.6); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .content-section { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media (min-width: 768px) { .main-container { max-width: 1000px; margin: 0 auto; } }
    </style>
</head>
<body class="pb-28">

    <div id="toast" class="fixed top-12 left-1/2 -translate-x-1/2 z-[100] transition-all duration-500 opacity-0 pointer-events-none">
        <div id="toastContent" class="px-6 py-3 rounded-full font-bold shadow-2xl flex items-center gap-2 text-sm text-white"></div>
    </div>

    <header class="p-6 flex flex-col items-center">
        <div class="flex gap-4 mb-4 text-xl bg-white/5 p-2 rounded-2xl border border-white/10">
            <span title="Turkish">🇹🇷</span><span title="Ukrainian">🇺🇦</span><span title="English">🇺🇸</span><span title="Russian">🇷🇺</span>
        </div>
        <h1 class="text-4xl font-extrabold tracking-tighter glow-text uppercase italic">İNVER <span class="text-cyan-400 font-light">вода</span></h1>
        <div id="dateDisplay" class="text-slate-400 text-[10px] mt-2 uppercase tracking-[0.2em] font-bold"></div>
    </header>

    <!-- ÜST ÖZET PANELİ -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 px-4 mb-8 max-w-6xl mx-auto">
        <div class="glass-card p-4 rounded-[1.5rem] border-b-4 border-green-500">
            <p class="text-[9px] uppercase text-slate-400 font-bold mb-1">Nakit Kasa</p>
            <h3 id="dash-cash" class="text-xl font-black text-green-400 italic">0 ₴</h3>
        </div>
        <div class="glass-card p-4 rounded-[1.5rem] border-b-4 border-blue-500">
            <p class="text-[9px] uppercase text-slate-400 font-bold mb-1">POS Çekimi</p>
            <h3 id="dash-pos" class="text-xl font-black text-blue-400 italic">0 ₴</h3>
        </div>
        <div class="glass-card p-4 rounded-[1.5rem] border-b-4 border-cyan-500">
            <p class="text-[9px] uppercase text-slate-400 font-bold mb-1">Depo Su</p>
            <h3 id="dash-tank" class="text-xl font-black italic">... L</h3>
        </div>
        <div class="glass-card p-4 rounded-[1.5rem] border-b-4 border-orange-500">
            <p class="text-[9px] uppercase text-slate-400 font-bold mb-1">Stok (5L/10L)</p>
            <h3 id="dash-bottles" class="text-xl font-black text-orange-400 italic">0/0</h3>
        </div>
    </div>

    <main class="px-4 main-container">
        <!-- SATIŞ EKRANI -->
        <section id="sales" class="content-section">
            <div class="glass-card p-6 rounded-[30px] mb-4">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-[10px] font-bold text-slate-500 uppercase">Satış Tarihi</span>
                    <input type="datetime-local" id="manualDate" class="bg-slate-900 text-[10px] p-2 rounded-lg border border-white/10 outline-none text-cyan-400">
                </div>
                
                <div class="grid grid-cols-3 gap-3 mb-6">
                    <button onclick="quickFill(5)" class="bg-slate-800/60 p-4 rounded-xl text-sm font-black border border-white/5">+5L</button>
                    <button onclick="quickFill(10)" class="bg-slate-800/60 p-4 rounded-xl text-sm font-black border border-white/5">+10L</button>
                    <button onclick="quickFill(19)" class="bg-slate-800/60 p-4 rounded-xl text-sm font-black border border-white/5">+19L</button>
                </div>

                <div class="space-y-4">
                    <div class="relative">
                        <input type="number" id="saleLiters" oninput="calculateSale()" class="w-full bg-slate-900/80 p-5 rounded-2xl border-2 border-slate-800 text-4xl font-black focus:border-cyan-500 outline-none text-center glow-text" placeholder="0">
                        <span class="absolute right-6 top-1/2 -translate-y-1/2 text-slate-600 font-black">L</span>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-slate-900/40 p-3 rounded-2xl flex justify-between items-center border border-white/5">
                            <span class="text-[9px] text-slate-400 font-bold uppercase">5L Şişe</span>
                            <input type="number" id="sale5L" oninput="calculateSale()" class="bg-transparent w-8 text-center font-black text-lg" value="0">
                        </div>
                        <div class="bg-slate-900/40 p-3 rounded-2xl flex justify-between items-center border border-white/5">
                            <span class="text-[9px] text-slate-400 font-bold uppercase">10L Şişe</span>
                            <input type="number" id="sale10L" oninput="calculateSale()" class="bg-transparent w-8 text-center font-black text-lg" value="0">
                        </div>
                    </div>

                    <div class="p-4 bg-cyan-500/10 rounded-2xl border border-cyan-500/30 text-center">
                        <h3 id="totalPriceDisplay" class="text-4xl font-black glow-text">0.00 ₴</h3>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="completeSale('Nakit')" class="bg-green-600 p-4 rounded-xl font-black text-xs uppercase">NAKİT</button>
                        <button onclick="completeSale('Kart')" class="bg-blue-600 p-4 rounded-xl font-black text-xs uppercase">KART / POS</button>
                    </div>
                </div>
            </div>

            <button onclick="runEndOfDay()" class="w-full glass-card p-4 rounded-2xl border-dashed border-cyan-500/50 text-cyan-400 font-black text-xs uppercase">
                <i class="fas fa-clock mr-2"></i> GÜN SONU RAPORU AL (09:00 - 19:50)
            </button>
        </section>

        <!-- İSTATİSTİKLER -->
        <section id="dashboard" class="content-section hidden space-y-4">
            <div class="glass-card p-6 rounded-[30px]">
                <div class="flex justify-between items-center mb-4">
                    <select id="statPeriod" onchange="renderChart()" class="bg-slate-900 text-[10px] p-2 rounded-xl border border-white/10 outline-none uppercase font-bold text-cyan-400">
                        <option value="daily">Günlük Satış</option>
                        <option value="weekly" selected>Haftalık Satış</option>
                        <option value="monthly">Aylık Satış</option>
                    </select>
                </div>
                <div class="h-64"><canvas id="mainChart"></canvas></div>
            </div>

            <div id="detailedStats" class="grid grid-cols-1 gap-3">
                <!-- Dinamik detaylı kazançlar buraya gelecek -->
            </div>
        </section>

        <!-- GEÇMİŞ -->
        <section id="history" class="content-section hidden">
            <div class="glass-card rounded-[30px] overflow-hidden">
                <div class="p-4 bg-white/5 border-b border-white/10 flex gap-2">
                    <input type="date" id="historyDate" onchange="updateHistory()" class="bg-slate-900 text-[10px] p-2 rounded-lg flex-1">
                    <button onclick="exportHistoryPDF()" class="bg-red-500 text-[9px] px-3 rounded-lg font-bold">PDF</button>
                </div>
                <div class="overflow-x-auto max-h-[400px]">
                    <table class="w-full text-left text-[11px]">
                        <thead class="bg-slate-900 text-slate-500 uppercase">
                            <tr><th class="p-3">Saat</th><th class="p-3">Detay</th><th class="p-3">Tip</th><th class="p-3 text-right">Tutar</th></tr>
                        </thead>
                        <tbody id="historyTable" class="divide-y divide-white/5"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- AYARLAR -->
        <section id="settings" class="content-section hidden space-y-4">
            <div class="glass-card p-6 rounded-[30px] space-y-4">
                <h2 class="text-xs font-black uppercase text-cyan-400 italic">Sistem Ayarları</h2>
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-slate-900/60 p-3 rounded-xl">
                        <label class="text-[8px] text-slate-500 uppercase">Su L Satış</label>
                        <input type="number" id="priceLitre" class="bg-transparent font-bold w-full outline-none text-white">
                    </div>
                    <div class="bg-slate-900/60 p-3 rounded-xl">
                        <label class="text-[8px] text-slate-500 uppercase">POS Komisyon (%)</label>
                        <input type="number" id="bankFeeRate" step="0.1" class="bg-transparent font-bold w-full outline-none text-yellow-400">
                    </div>
                </div>
                <button onclick="saveGlobalSettings()" class="w-full bg-cyan-600 py-4 rounded-xl font-black text-xs uppercase">AYARLARI KAYDET</button>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="exportBackup()" class="bg-slate-800 py-3 rounded-xl text-[9px] uppercase font-bold">Yedekle</button>
                    <button onclick="factoryReset()" class="bg-red-900/40 text-red-500 py-3 rounded-xl text-[9px] uppercase font-bold">VERİLERİ SIFIRLA</button>
                </div>
            </div>
        </section>
    </main>

    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-sm glass-card rounded-[2rem] p-2 flex justify-around items-center z-50 border border-white/10">
        <button onclick="showSection('sales')" class="nav-btn active-nav w-12 h-12 rounded-full flex items-center justify-center transition-all"><i class="fas fa-tint"></i></button>
        <button onclick="showSection('dashboard')" class="nav-btn w-12 h-12 rounded-full flex items-center justify-center text-slate-500"><i class="fas fa-chart-bar"></i></button>
        <button onclick="showSection('history')" class="nav-btn w-12 h-12 rounded-full flex items-center justify-center text-slate-500"><i class="fas fa-history"></i></button>
        <button onclick="showSection('settings')" class="nav-btn w-12 h-12 rounded-full flex items-center justify-center text-slate-500"><i class="fas fa-cog"></i></button>
    </nav>

    <script>
        const API_KEY = '$2a$10$QA58wc50wyQ3g8E9oqDNK./CTiaqIk0kjStY.wLOo4mUG9uZ7sQju';
        const BIN_ID = '69f5cd6baaba882197617526'; 

        let db = {
            settings: { priceLitre: 5, costLitre: 1.5, price5L: 20, cost5L: 12, price10L: 35, cost10L: 18, tankMax: 2000, bankFee: 1.3 },
            stock: { tankWater: 1500, bottles5L: 100, bottles10L: 50 },
            sales: []
        };

        async function loadCloudData() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { 'X-Master-Key': API_KEY } });
                const data = await res.json();
                if(data.record) { db = data.record; renderUI(); }
            } catch (err) {
                const local = localStorage.getItem('inver_db');
                if(local) db = JSON.parse(local);
                renderUI();
            }
        }

        async function saveCloudData() {
            localStorage.setItem('inver_db', JSON.stringify(db));
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                    body: JSON.stringify(db)
                });
            } catch (err) { console.error("Cloud error", err); }
            renderUI();
        }

        function calculateSale() {
            const l = parseFloat(document.getElementById('saleLiters').value) || 0;
            const b5 = parseInt(document.getElementById('sale5L').value) || 0;
            const b10 = parseInt(document.getElementById('sale10L').value) || 0;
            const total = (l * db.settings.priceLitre) + (b5 * db.settings.price5L) + (b10 * db.settings.price10L);
            document.getElementById('totalPriceDisplay').innerText = total.toFixed(2) + ' ₴';
        }

        function completeSale(method) {
            const l = parseFloat(document.getElementById('saleLiters').value) || 0;
            const b5 = parseInt(document.getElementById('sale5L').value) || 0;
            const b10 = parseInt(document.getElementById('sale10L').value) || 0;
            const manualDate = document.getElementById('manualDate').value;

            if(l + b5 + b10 === 0) return;

            const gross = (l * db.settings.priceLitre) + (b5 * db.settings.price5L) + (b10 * db.settings.price10L);
            const cost = (l * db.settings.costLitre) + (b5 * db.settings.cost5L) + (b10 * db.settings.cost10L);

            db.sales.push({
                date: manualDate ? new Date(manualDate).toISOString() : new Date().toISOString(),
                liters: l, b5, b10, gross, profit: gross - cost, method
            });

            db.stock.tankWater -= l;
            db.stock.bottles5L -= b5;
            db.stock.bottles10L -= b10;

            document.getElementById('saleLiters').value = '';
            document.getElementById('sale5L').value = 0;
            document.getElementById('sale10L').value = 0;
            document.getElementById('manualDate').value = '';
            
            saveCloudData();
            notify("Satış Kaydedildi");
        }

        function renderUI() {
            const todayStr = new Date().toLocaleDateString();
            const todaySales = db.sales.filter(s => new Date(s.date).toLocaleDateString() === todayStr);
            
            const cash = todaySales.filter(s => s.method === 'Nakit').reduce((a,b) => a + b.gross, 0);
            const pos = todaySales.filter(s => s.method === 'Kart').reduce((a,b) => a + b.gross, 0);

            document.getElementById('dash-cash').innerText = cash.toFixed(1) + ' ₴';
            document.getElementById('dash-pos').innerText = pos.toFixed(1) + ' ₴';
            document.getElementById('dash-tank').innerText = Math.floor(db.stock.tankWater) + ' L';
            document.getElementById('dash-bottles').innerText = `${db.stock.bottles5L}/${db.stock.bottles10L}`;

            document.getElementById('priceLitre').value = db.settings.priceLitre;
            document.getElementById('bankFeeRate').value = db.settings.bankFee;
        }

        function runEndOfDay() {
            const today = new Date().toLocaleDateString();
            const todaySales = db.sales.filter(s => new Date(s.date).toLocaleDateString() === today);
            
            const cash = todaySales.filter(s => s.method === 'Nakit').reduce((a,b) => a + b.gross, 0);
            const pos = todaySales.filter(s => s.method === 'Kart').reduce((a,b) => a + b.gross, 0);
            const bankKesinti = pos * (db.settings.bankFee / 100);
            const netKar = todaySales.reduce((a,b) => a + b.profit, 0) - bankKesinti;

            alert(`GÜN SONU ÖZETİ (${today})\n--------------------------\nNakit Kasa: ${cash.toFixed(2)} ₴\nPOS Toplam: ${pos.toFixed(2)} ₴\nBanka Kesinti: -${bankKesinti.toFixed(2)} ₴\nBugün Net Kâr: ${netKar.toFixed(2)} ₴\n--------------------------\nDükkan: 09:00 - 19:50`);
        }

        function updateHistory() {
            const filter = document.getElementById('historyDate').value;
            let filtered = db.sales.slice().reverse();
            if(filter) filtered = filtered.filter(s => new Date(s.date).toISOString().split('T')[0] === filter);

            document.getElementById('historyTable').innerHTML = filtered.map(s => `
                <tr>
                    <td class="p-3 opacity-60">${new Date(s.date).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</td>
                    <td class="p-3 font-bold">${s.liters}L ${s.b5>0?'+'+s.b5+'şişe':''}</td>
                    <td class="p-3"><span class="${s.method==='Kart'?'text-blue-400':'text-green-400'}">${s.method}</span></td>
                    <td class="p-3 text-right font-black">${s.gross.toFixed(1)}</td>
                </tr>
            `).join('');
        }

        let chart;
        function renderChart() {
            const ctx = document.getElementById('mainChart').getContext('2d');
            const period = document.getElementById('statPeriod').value;
            if(chart) chart.destroy();

            let labels = [], data = [];
            const count = period === 'daily' ? 1 : (period === 'weekly' ? 7 : 30);

            for(let i=count-1; i>=0; i--) {
                let d = new Date(); d.setDate(d.getDate()-i);
                labels.push(d.toLocaleDateString('tr-TR', {day:'numeric', month:'short'}));
                const val = db.sales.filter(s => new Date(s.date).toLocaleDateString() === d.toLocaleDateString()).reduce((a,b)=>a+b.gross, 0);
                data.push(val);
            }

            chart = new Chart(ctx, {
                type: 'line',
                data: { labels, datasets: [{ label: 'Ciro', data, borderColor: '#00d2ff', backgroundColor: 'rgba(0,210,255,0.1)', fill: true, tension: 0.3 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

        function showSection(id) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-nav'));
            event.currentTarget.classList.add('active-nav');
            if(id === 'dashboard') renderChart();
            if(id === 'history') updateHistory();
        }

        function saveGlobalSettings() {
            db.settings.priceLitre = parseFloat(document.getElementById('priceLitre').value);
            db.settings.bankFee = parseFloat(document.getElementById('bankFeeRate').value);
            saveCloudData();
            notify("Ayarlar Kaydedildi");
        }

        async function factoryReset() {
            if(confirm("TÜM VERİLER BULUTTAN VE TELEFONDAN SİLİNECEK! Emin misiniz?")) {
                db.sales = [];
                // Cloud verisini tamamen temizle
                localStorage.removeItem('inver_db');
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                    body: JSON.stringify({ settings: db.settings, stock: db.stock, sales: [] })
                });
                location.reload();
            }
        }

        function quickFill(n) { document.getElementById('saleLiters').value = (parseFloat(document.getElementById('saleLiters').value) || 0) + n; calculateSale(); }
        
        function notify(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastContent').innerText = msg;
            t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 2000);
        }

        setInterval(() => {
            document.getElementById('dateDisplay').innerHTML = new Date().toLocaleString('tr-TR', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
        }, 1000);

        loadCloudData();
    </script>
</body>
</html>
