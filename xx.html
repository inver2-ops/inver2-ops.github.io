<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>İNVER voda | Cloud Elite v11.5 Business</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        :root { --primary: #00d2ff; --secondary: #3a7bd5; --dark: #050b18; }
        body { 
            font-family: 'Outfit', sans-serif; 
            background: radial-gradient(circle at top right, #1e293b, #050b18);
            color: #e2e8f0; min-height: 100vh; margin: 0; overflow-x: hidden;
        }
        .glass-card { background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .active-nav { background: linear-gradient(135deg, var(--primary), var(--secondary)); box-shadow: 0 0 20px rgba(0, 210, 255, 0.5); color: white !important; }
        .glow-text { text-shadow: 0 0 15px rgba(0, 210, 255, 0.6); }
        .content-section { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media (min-width: 768px) { .main-container { max-width: 1000px; margin: 0 auto; } }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-28">

    <div id="toast" class="fixed top-12 left-1/2 -translate-x-1/2 z-[100] transition-all duration-500 opacity-0 pointer-events-none">
        <div id="toastContent" class="px-6 py-3 rounded-full font-bold shadow-2xl text-sm text-white"></div>
    </div>

    <header class="p-6 flex flex-col items-center">
        <div class="flex gap-4 mb-4 text-xl bg-white/5 p-2 rounded-2xl border border-white/10">
            <span title="TR">🇹🇷</span><span title="UA">🇺🇦</span><span title="EN">🇺🇸</span><span title="RU">🇷🇺</span>
        </div>
        <h1 class="text-4xl font-extrabold tracking-tighter glow-text uppercase italic">İNVER <span class="text-cyan-400 font-light">вода</span></h1>
        <div id="dateDisplay" class="text-slate-400 text-[10px] mt-2 uppercase tracking-[0.2em] font-bold"></div>
    </header>

    <!-- DASHBOARD ÖZET -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 px-4 mb-4 max-w-6xl mx-auto">
        <div class="glass-card p-4 rounded-[1.5rem] border-b-4 border-green-500">
            <p class="text-[9px] uppercase text-slate-400 font-bold mb-1 italic">Kasa (Bugün)</p>
            <h3 id="dash-cash" class="text-xl font-black text-green-400 italic">0 ₴</h3>
        </div>
        <div class="glass-card p-4 rounded-[1.5rem] border-b-4 border-blue-500">
            <p class="text-[9px] uppercase text-slate-400 font-bold mb-1 italic">Satılan (Bugün)</p>
            <h3 id="dash-sold-today" class="text-xl font-black text-blue-400 italic">0 L</h3>
        </div>
        <div class="glass-card p-4 rounded-[1.5rem] border-b-4 border-cyan-500">
            <p class="text-[9px] uppercase text-slate-400 font-bold mb-1 italic">Tank Durumu</p>
            <div class="flex items-end gap-1">
                <h3 id="dash-tank" class="text-xl font-black italic">...</h3>
                <span class="text-[10px] text-cyan-500 mb-1 font-bold">LİTRE</span>
            </div>
        </div>
        <div class="glass-card p-4 rounded-[1.5rem] border-b-4 border-orange-500">
            <p class="text-[9px] uppercase text-slate-400 font-bold mb-1 italic">Boş Şişe 5/10L</p>
            <h3 id="dash-bottles" class="text-xl font-black text-orange-400 italic">0/0</h3>
        </div>
    </div>

    <!-- GÜN SONU BUTONU -->
    <div class="px-4 mb-8 max-w-6xl mx-auto">
        <button onclick="generateEndOfDayPDF()" class="w-full bg-gradient-to-r from-amber-500 to-orange-600 p-4 rounded-2xl font-black text-xs uppercase shadow-lg active:scale-95 italic transition-all flex items-center justify-center gap-3">
            <i class="fas fa-file-invoice-dollar text-lg"></i>
            GÜN SONU RAPORUNU AL (09:00 - 20:00)
        </button>
    </div>

    <main class="px-4 main-container">
        <!-- SATIŞ EKRANI -->
        <section id="sales" class="content-section">
            <div class="glass-card p-6 rounded-[30px] mb-4">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-[10px] font-bold text-slate-500 uppercase italic">İşlem Zamanı (Geriye Dönük)</span>
                    <input type="datetime-local" id="manualDate" class="bg-slate-900 text-[10px] p-2 rounded-lg border border-white/10 outline-none text-cyan-400 font-bold">
                </div>
                
                <div class="grid grid-cols-4 gap-2 mb-6 text-[10px] font-black italic">
                    <button onclick="quickFill(5)" class="bg-slate-800/60 py-4 rounded-xl border border-white/5 active:scale-90 transition">+5L</button>
                    <button onclick="quickFill(10)" class="bg-slate-800/60 py-4 rounded-xl border border-white/5 active:scale-90 transition">+10L</button>
                    <button onclick="quickFill(19)" class="bg-slate-800/60 py-4 rounded-xl border border-white/5 active:scale-90 transition">+19L</button>
                    <button onclick="clearSale()" class="bg-red-900/20 text-red-500 py-4 rounded-xl border border-red-500/10 active:scale-90 transition">SİL</button>
                </div>

                <div class="space-y-4">
                    <div class="relative">
                        <input type="number" id="saleLiters" oninput="calculateSale()" class="w-full bg-slate-900/80 p-5 rounded-2xl border-2 border-slate-800 text-5xl font-black focus:border-cyan-500 outline-none text-center glow-text italic" placeholder="0">
                        <span class="absolute right-6 top-1/2 -translate-y-1/2 text-slate-600 font-black italic">L</span>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-slate-900/40 p-3 rounded-2xl flex flex-col items-center border border-white/5">
                            <span class="text-[8px] text-slate-500 font-bold uppercase mb-2">5L Şişe Satış</span>
                            <div class="flex items-center gap-4">
                                <button onclick="adjValue('sale5L', -1)" class="text-red-500 text-xl"><i class="fas fa-minus-circle"></i></button>
                                <input type="number" id="sale5L" oninput="calculateSale()" class="bg-transparent w-8 text-center font-black text-xl italic" value="0" readonly>
                                <button onclick="adjValue('sale5L', 1)" class="text-green-500 text-xl"><i class="fas fa-plus-circle"></i></button>
                            </div>
                        </div>
                        <div class="bg-slate-900/40 p-3 rounded-2xl flex flex-col items-center border border-white/5">
                            <span class="text-[8px] text-slate-500 font-bold uppercase mb-2">10L Şişe Satış</span>
                            <div class="flex items-center gap-4">
                                <button onclick="adjValue('sale10L', -1)" class="text-red-500 text-xl"><i class="fas fa-minus-circle"></i></button>
                                <input type="number" id="sale10L" oninput="calculateSale()" class="bg-transparent w-8 text-center font-black text-xl italic" value="0" readonly>
                                <button onclick="adjValue('sale10L', 1)" class="text-green-500 text-xl"><i class="fas fa-plus-circle"></i></button>
                            </div>
                        </div>
                    </div>

                    <div class="p-4 bg-cyan-500/10 rounded-2xl border border-cyan-500/30 text-center">
                        <p class="text-[9px] text-cyan-400 font-bold uppercase mb-1 italic">Toplam Tahsilat</p>
                        <h3 id="totalPriceDisplay" class="text-4xl font-black glow-text italic">0.00 ₴</h3>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="completeSale('Nakit')" class="bg-green-600 p-4 rounded-xl font-black text-xs uppercase shadow-lg active:scale-95 italic transition-all">NAKİT ÖDEME</button>
                        <button onclick="completeSale('Kart')" class="bg-blue-600 p-4 rounded-xl font-black text-xs uppercase shadow-lg active:scale-95 italic transition-all">KART / POS</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- DASHBOARD (İstatistik) -->
        <section id="dashboard" class="content-section hidden space-y-4">
            <div class="glass-card p-6 rounded-[30px]">
                <div class="flex justify-between items-center mb-6">
                    <select id="statPeriod" onchange="renderAnalytics()" class="bg-slate-900 text-[10px] p-2 rounded-xl border border-white/10 outline-none uppercase font-bold text-cyan-400 italic">
                        <option value="1">Bugün</option>
                        <option value="7" selected>Son 7 Gün</option>
                        <option value="30">Son 30 Gün</option>
                    </select>
                    <div id="statSum" class="text-xs font-black text-green-400 italic px-3 py-1 bg-green-400/10 rounded-full border border-green-400/20">Net Kâr: 0 ₴</div>
                </div>
                <div class="h-64"><canvas id="mainChart"></canvas></div>
            </div>

            <div class="glass-card rounded-[25px] overflow-hidden">
                <table class="w-full text-[11px] text-left italic">
                    <thead class="bg-white/5 text-slate-500 uppercase font-black">
                        <tr><th class="p-4">DETAY</th><th class="p-4">TOPLAM MİKTAR</th><th class="p-4 text-right">NET KAZANÇ</th></tr>
                    </thead>
                    <tbody id="detailedStatsBody" class="divide-y divide-white/5"></tbody>
                </table>
            </div>
        </section>

        <!-- GEÇMİŞ -->
        <section id="history" class="content-section hidden">
            <div class="glass-card rounded-[30px] overflow-hidden">
                <div class="p-4 bg-white/5 border-b border-white/10 flex gap-2">
                    <input type="date" id="historyDate" onchange="updateHistory()" class="bg-slate-900 text-[10px] p-2 rounded-lg flex-1 outline-none text-white font-bold italic">
                    <button onclick="exportHistoryPDF()" class="bg-red-600 px-4 rounded-lg text-[10px] font-black uppercase active:scale-95 italic">PDF İNDİR</button>
                </div>
                <div class="max-h-[550px] overflow-y-auto scrollbar-hide">
                    <table class="w-full text-left text-[10px] italic">
                        <thead class="bg-slate-900 text-slate-500 uppercase font-bold sticky top-0 z-10">
                            <tr>
                                <th class="p-3 w-10 text-center"><i class="fas fa-trash"></i></th>
                                <th class="p-3">SAAT</th>
                                <th class="p-3">DETAY</th>
                                <th class="p-3 text-right">TUTAR</th>
                            </tr>
                        </thead>
                        <tbody id="historyTable" class="divide-y divide-white/5 font-medium"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- AYARLAR -->
        <section id="settings" class="content-section hidden space-y-4">
            <div class="glass-card p-6 rounded-[30px] space-y-6">
                <div>
                    <h2 class="text-[10px] font-black text-cyan-400 uppercase italic mb-3"><i class="fas fa-tag mr-2"></i> Fiyatlandırma (₴)</h2>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-slate-900/60 p-3 rounded-xl border border-white/5"><label class="text-[8px] text-slate-500 uppercase italic">1L Satış</label><input type="number" step="0.1" id="setPriceLitre" class="bg-transparent font-black w-full outline-none text-cyan-400 italic"></div>
                        <div class="bg-slate-900/60 p-3 rounded-xl border border-white/5"><label class="text-[8px] text-slate-500 uppercase italic">1L Maliyet</label><input type="number" step="0.1" id="setCostLitre" class="bg-transparent font-black w-full outline-none text-red-400 italic"></div>
                        <div class="bg-slate-900/60 p-3 rounded-xl border border-white/5"><label class="text-[8px] text-slate-500 uppercase italic">5L Şişe Satış</label><input type="number" id="setPrice5L" class="bg-transparent font-black w-full outline-none text-cyan-400 italic"></div>
                        <div class="bg-slate-900/60 p-3 rounded-xl border border-white/5"><label class="text-[8px] text-slate-500 uppercase italic">5L Şişe Maliyet</label><input type="number" id="setCost5L" class="bg-transparent font-black w-full outline-none text-red-400 italic"></div>
                        <div class="bg-slate-900/60 p-3 rounded-xl border border-white/5"><label class="text-[8px] text-slate-500 uppercase italic">10L Şişe Satış</label><input type="number" id="setPrice10L" class="bg-transparent font-black w-full outline-none text-cyan-400 italic"></div>
                        <div class="bg-slate-900/60 p-3 rounded-xl border border-white/5"><label class="text-[8px] text-slate-500 uppercase italic">10L Şişe Maliyet</label><input type="number" id="setCost10L" class="bg-transparent font-black w-full outline-none text-red-400 italic"></div>
                        <div class="bg-slate-900/60 p-3 rounded-xl border border-white/5"><label class="text-[8px] text-slate-500 uppercase italic">Kart Komisyon (%)</label><input type="number" step="0.1" id="setBankFee" class="bg-transparent font-black w-full outline-none text-blue-400 italic"></div>
                    </div>
                </div>

                <div>
                    <h2 class="text-[10px] font-black text-orange-400 uppercase italic mb-3"><i class="fas fa-warehouse mr-2"></i> Stok Güncelle</h2>
                    <div class="grid grid-cols-3 gap-3 text-center">
                        <div class="bg-slate-900/60 p-3 rounded-xl border border-white/5"><label class="text-[8px] text-slate-500 uppercase italic">Su (L)</label><input type="number" id="setStockTank" class="bg-transparent font-black w-full outline-none text-white italic text-center"></div>
                        <div class="bg-slate-900/60 p-3 rounded-xl border border-white/5"><label class="text-[8px] text-slate-500 uppercase italic">5L Şişe</label><input type="number" id="setStock5L" class="bg-transparent font-black w-full outline-none text-white italic text-center"></div>
                        <div class="bg-slate-900/60 p-3 rounded-xl border border-white/5"><label class="text-[8px] text-slate-500 uppercase italic">10L Şişe</label><input type="number" id="setStock10L" class="bg-transparent font-black w-full outline-none text-white italic text-center"></div>
                    </div>
                </div>

                <button onclick="saveGlobalSettings()" class="w-full bg-gradient-to-r from-cyan-600 to-blue-700 py-5 rounded-2xl font-black text-xs uppercase shadow-xl active:scale-95 transition-all italic">AYARLARI KAYDET</button>
                <button onclick="resetSystem()" class="w-full text-red-500 text-[10px] font-bold uppercase opacity-50">Tüm Verileri Temizle</button>
            </div>
        </section>
    </main>

    <!-- ALT NAVİGASYON -->
    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[92%] max-w-sm glass-card rounded-[2.5rem] p-2 flex justify-around items-center z-50 border border-white/10 shadow-2xl">
        <button onclick="showSection('sales')" class="nav-btn active-nav w-14 h-14 rounded-full flex items-center justify-center transition-all"><i class="fas fa-tint"></i></button>
        <button onclick="showSection('dashboard')" class="nav-btn w-14 h-14 rounded-full flex items-center justify-center text-slate-500"><i class="fas fa-chart-line"></i></button>
        <button onclick="showSection('history')" class="nav-btn w-14 h-14 rounded-full flex items-center justify-center text-slate-500"><i class="fas fa-clipboard-list"></i></button>
        <button onclick="showSection('settings')" class="nav-btn w-14 h-14 rounded-full flex items-center justify-center text-slate-500"><i class="fas fa-sliders-h"></i></button>
    </nav>

    <script>
        const API_KEY = '$2a$10$QA58wc50wyQ3g8E9oqDNK./CTiaqIk0kjStY.wLOo4mUG9uZ7sQju';
        const BIN_ID = '69f5cd6baaba882197617526'; 

        const saleAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3');

        let db = {
            settings: { priceLitre: 5.0, costLitre: 1.5, price5L: 20, cost5L: 12, price10L: 35, cost10L: 18, bankFee: 1.3 },
            stock: { tankWater: 1500, bottles5L: 100, bottles10L: 50 },
            sales: []
        };

        let myChart = null;

        async function loadData() {
            const localData = localStorage.getItem('inver_v11_db');
            if(localData) { 
                db = JSON.parse(localData); 
                fillSettingsFields();
                renderUI(); 
            }
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { 
                    headers: { 'X-Master-Key': API_KEY, 'Cache-Control': 'no-cache' } 
                });
                const data = await res.json();
                if(data.record) {
                    db = data.record;
                    localStorage.setItem('inver_v11_db', JSON.stringify(db));
                    fillSettingsFields();
                    renderUI();
                }
            } catch (err) { console.error("Sync Hatası"); }
        }

        async function syncCloud() {
            localStorage.setItem('inver_v11_db', JSON.stringify(db));
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                    body: JSON.stringify(db)
                });
                renderUI();
            } catch (err) { notify("Bağlantı Hatası!", "error"); }
        }

        function fillSettingsFields() {
            document.getElementById('setPriceLitre').value = db.settings.priceLitre;
            document.getElementById('setCostLitre').value = db.settings.costLitre;
            document.getElementById('setPrice5L').value = db.settings.price5L;
            document.getElementById('setCost5L').value = db.settings.cost5L;
            document.getElementById('setPrice10L').value = db.settings.price10L;
            document.getElementById('setCost10L').value = db.settings.cost10L;
            document.getElementById('setBankFee').value = db.settings.bankFee;
            document.getElementById('setStockTank').value = db.stock.tankWater;
            document.getElementById('setStock5L').value = db.stock.bottles5L;
            document.getElementById('setStock10L').value = db.stock.bottles10L;
        }

        function saveGlobalSettings() {
            db.settings.priceLitre = parseFloat(document.getElementById('setPriceLitre').value) || 0;
            db.settings.costLitre = parseFloat(document.getElementById('setCostLitre').value) || 0;
            db.settings.price5L = parseFloat(document.getElementById('setPrice5L').value) || 0;
            db.settings.cost5L = parseFloat(document.getElementById('setCost5L').value) || 0;
            db.settings.price10L = parseFloat(document.getElementById('setPrice10L').value) || 0;
            db.settings.cost10L = parseFloat(document.getElementById('setCost10L').value) || 0;
            db.settings.bankFee = parseFloat(document.getElementById('setBankFee').value) || 0;
            db.stock.tankWater = parseFloat(document.getElementById('setStockTank').value) || 0;
            db.stock.bottles5L = parseInt(document.getElementById('setStock5L').value) || 0;
            db.stock.bottles10L = parseInt(document.getElementById('setStock10L').value) || 0;
            syncCloud();
            notify("Ayarlar Kaydedildi", "success");
        }

        function calculateSale() {
            const litre = parseFloat(document.getElementById('saleLiters').value) || 0;
            const b5 = parseInt(document.getElementById('sale5L').value) || 0;
            const b10 = parseInt(document.getElementById('sale10L').value) || 0;
            const total = (litre * db.settings.priceLitre) + (b5 * db.settings.price5L) + (b10 * db.settings.price10L);
            document.getElementById('totalPriceDisplay').innerText = total.toFixed(2) + ' ₴';
        }

        function completeSale(method) {
            const litre = parseFloat(document.getElementById('saleLiters').value) || 0;
            const b5 = parseInt(document.getElementById('sale5L').value) || 0;
            const b10 = parseInt(document.getElementById('sale10L').value) || 0;
            const mDate = document.getElementById('manualDate').value;

            if (litre === 0 && b5 === 0 && b10 === 0) return notify("Miktar girin!", "error");

            const gross = (litre * db.settings.priceLitre) + (b5 * db.settings.price5L) + (b10 * db.settings.price10L);
            const cost = (litre * db.settings.costLitre) + (b5 * db.settings.cost5L) + (b10 * db.settings.cost10L);

            const entry = {
                id: Date.now(),
                date: mDate ? new Date(mDate).toISOString() : new Date().toISOString(),
                liters: litre, b5: b5, b10: b10,
                gross: gross, profit: gross - cost, method: method
            };

            db.sales.push(entry);
            db.stock.tankWater -= litre;
            db.stock.bottles5L -= b5;
            db.stock.bottles10L -= b10;

            saleAudio.play();
            clearSale();
            syncCloud();
            notify("Satış Tamamlandı", "success");
        }

        function clearSale() {
            document.getElementById('saleLiters').value = '';
            document.getElementById('sale5L').value = 0;
            document.getElementById('sale10L').value = 0;
            document.getElementById('manualDate').value = '';
            calculateSale();
        }

        function deleteSale(id) {
            if(!confirm("Bu satışı siliyorsunuz. Stoklar iade edilecek. Onay?")) return;
            const index = db.sales.findIndex(s => s.id === id);
            if(index > -1) {
                const s = db.sales[index];
                db.stock.tankWater += s.liters;
                db.stock.bottles5L += s.b5;
                db.stock.bottles10L += s.b10;
                db.sales.splice(index, 1);
                syncCloud();
                updateHistory();
                notify("Satış Geri Alındı", "success");
            }
        }

        function renderUI() {
            const todayStr = new Date().toLocaleDateString();
            const todaySales = db.sales.filter(s => new Date(s.date).toLocaleDateString() === todayStr);
            
            const cash = todaySales.filter(s => s.method === 'Nakit').reduce((a,b)=>a+b.gross, 0);
            const totalLitreToday = todaySales.reduce((a,b)=>a+b.liters, 0);

            document.getElementById('dash-cash').innerText = cash.toFixed(1) + ' ₴';
            document.getElementById('dash-sold-today').innerText = totalLitreToday.toFixed(1) + ' L';
            document.getElementById('dash-tank').innerText = Math.floor(db.stock.tankWater);
            document.getElementById('dash-bottles').innerText = `${db.stock.bottles5L} / ${db.stock.bottles10L}`;
        }

        function updateHistory() {
            const hDateInput = document.getElementById('historyDate').value;
            const targetDate = hDateInput ? new Date(hDateInput).toLocaleDateString() : new Date().toLocaleDateString();
            
            const filtered = db.sales
                .filter(s => new Date(s.date).toLocaleDateString() === targetDate)
                .sort((a,b) => b.id - a.id);
            
            let html = '';
            filtered.forEach(s => {
                const time = new Date(s.date).toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'});
                let details = [];
                if(s.liters > 0) details.push(`${s.liters}L Su`);
                if(s.b5 > 0) details.push(`${s.b5}x5L Şişe`);
                if(s.b10 > 0) details.push(`${s.b10}x10L Şişe`);
                
                html += `
                    <tr>
                        <td class="p-3 text-center"><button onclick="deleteSale(${s.id})" class="text-red-500/30 hover:text-red-500"><i class="fas fa-times-circle text-lg"></i></button></td>
                        <td class="p-3 font-bold text-slate-300">${time}</td>
                        <td class="p-3 text-slate-400 leading-tight">${details.join('<br>')} <br> <span class="text-[7px] text-cyan-500 font-bold uppercase">${s.method}</span></td>
                        <td class="p-3 text-right font-black text-white">${s.gross.toFixed(1)} ₴</td>
                    </tr>`;
            });
            document.getElementById('historyTable').innerHTML = html || '<tr><td colspan="4" class="p-10 text-center opacity-30 italic text-white">Bu tarihte kayıt bulunamadı.</td></tr>';
        }

        function renderAnalytics() {
            const period = parseInt(document.getElementById('statPeriod').value);
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - period);
            
            const filtered = db.sales.filter(s => new Date(s.date) >= cutoff);
            
            const stats = {
                waterL: filtered.reduce((a,b)=>a+b.liters, 0),
                b5: filtered.reduce((a,b)=>a+b.b5, 0),
                b10: filtered.reduce((a,b)=>a+b.b10, 0),
                gross: filtered.reduce((a,b)=>a+b.gross, 0),
                profit: filtered.reduce((a,b)=>a+b.profit, 0),
                posVol: filtered.filter(s => s.method === 'Kart').reduce((a,b)=>a+b.gross, 0)
            };

            const bankFees = stats.posVol * (db.settings.bankFee / 100);
            const netProfit = stats.profit - bankFees;

            document.getElementById('statSum').innerText = `Net Kâr: ${netProfit.toFixed(1)} ₴`;

            const ctx = document.getElementById('mainChart').getContext('2d');
            if(myChart) myChart.destroy();
            
            const chartData = filtered.slice(-10);
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartData.map(s => new Date(s.date).toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'})),
                    datasets: [{
                        label: 'Satış',
                        data: chartData.map(s => s.gross),
                        borderColor: '#00d2ff',
                        backgroundColor: 'rgba(0, 210, 255, 0.1)',
                        fill: true,
                        tension: 0.4,
                        borderWidth: 3,
                        pointRadius: 4,
                        pointBackgroundColor: '#00d2ff'
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    scales: { y: { grid: { color: 'rgba(255,255,255,0.05)' } }, x: { grid: { display: false } } },
                    plugins: { legend: { display: false } } 
                }
            });

            document.getElementById('detailedStatsBody').innerHTML = `
                <tr><td class="p-4">Su Satışı (L)</td><td class="p-4">${stats.waterL.toFixed(1)} Litre</td><td class="p-4 text-right text-white">${(stats.waterL * (db.settings.priceLitre - db.settings.costLitre)).toFixed(1)} ₴</td></tr>
                <tr><td class="p-4">Boş 5L Şişe</td><td class="p-4">${stats.b5} Adet</td><td class="p-4 text-right text-white">${(stats.b5 * (db.settings.price5L - db.settings.cost5L)).toFixed(1)} ₴</td></tr>
                <tr><td class="p-4">Boş 10L Şişe</td><td class="p-4">${stats.b10} Adet</td><td class="p-4 text-right text-white">${(stats.b10 * (db.settings.price10L - db.settings.cost10L)).toFixed(1)} ₴</td></tr>
                <tr><td class="p-4">Banka Kesinti</td><td class="p-4">%${db.settings.bankFee}</td><td class="p-4 text-right text-red-400">-${bankFees.toFixed(1)} ₴</td></tr>
                <tr class="bg-cyan-500/10 font-black"><td class="p-4 text-cyan-400">TOPLAM NET KÂR</td><td class="p-4"></td><td class="p-4 text-right text-cyan-400 text-lg">${netProfit.toFixed(1)} ₴</td></tr>
            `;
        }

        async function generateEndOfDayPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const now = new Date();
            const todayStr = now.toLocaleDateString('tr-TR');

            // Mesai Saatleri Filtresi (09:00 - 20:00)
            const workStart = new Date(now.setHours(9,0,0,0));
            const workEnd = new Date(now.setHours(20,0,0,0));

            const dailySales = db.sales.filter(s => {
                const sDate = new Date(s.date);
                return sDate.toLocaleDateString('tr-TR') === todayStr && 
                       sDate.getHours() >= 9 && sDate.getHours() < 20;
            });

            const stats = {
                waterL: dailySales.reduce((a,b)=>a+b.liters, 0),
                b5: dailySales.reduce((a,b)=>a+b.b5, 0),
                b10: dailySales.reduce((a,b)=>a+b.b10, 0),
                nakit: dailySales.filter(s=>s.method==='Nakit').reduce((a,b)=>a+b.gross, 0),
                kart: dailySales.filter(s=>s.method==='Kart').reduce((a,b)=>a+b.gross, 0),
                profit: dailySales.reduce((a,b)=>a+b.profit, 0)
            };

            const bankFee = stats.kart * (db.settings.bankFee / 100);
            const netKazancl = stats.profit - bankFee;

            // PDF İçerik Oluşturma
            doc.setFontSize(22);
            doc.text("INVER WATER - GUN SONU RAPORU", 14, 20);
            doc.setFontSize(10);
            doc.text(`Tarih: ${todayStr} | Mesai: 09:00 - 20:00`, 14, 28);
            doc.line(14, 32, 196, 32);

            const summaryData = [
                ["Toplam Satilan Su", `${stats.waterL.toFixed(1)} Litre`],
                ["Satilan 5L Sise", `${stats.b5} Adet`],
                ["Satilan 10L Sise", `${stats.b10} Adet`],
                ["", ""],
                ["Nakit Tahsilat", `${stats.nakit.toFixed(2)} Z`],
                ["Kart/POS Tahsilat", `${stats.kart.toFixed(2)} Z`],
                ["Banka Komisyonu", `-${bankFee.toFixed(2)} Z`],
                ["TOPLAM CIRO", `${(stats.nakit + stats.kart).toFixed(2)} Z`],
                ["NET GUNLUK KAR", `${netKazancl.toFixed(2)} Z`]
            ];

            doc.autoTable({
                startY: 40,
                head: [['Aciklama', 'Deger']],
                body: summaryData,
                theme: 'striped',
                headStyles: { fillColor: [0, 210, 255] }
            });

            doc.save(`Inver_GunSonu_${todayStr.replace(/\./g,'-')}.pdf`);
            notify("Gün Sonu PDF Hazırlandı", "success");
        }

        async function exportHistoryPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const hDate = document.getElementById('historyDate').value || new Date().toISOString().split('T')[0];
            doc.text(`INVER WATER - SATIS RAPORU (${hDate})`, 14, 20);
            const rows = db.sales.filter(s => new Date(s.date).toLocaleDateString() === new Date(hDate).toLocaleDateString()).map(s => [
                new Date(s.date).toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'}),
                `${s.liters}L + ${s.b5}x5 + ${s.b10}x10`, s.method, s.gross.toFixed(2) + " ₴"
            ]);
            doc.autoTable({ startY: 30, head: [['Saat', 'Detay', 'Odeme', 'Tutar']], body: rows });
            doc.save(`inver-rapor-${hDate}.pdf`);
        }

        function showSection(id) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-nav', 'text-white'));
            event.currentTarget.classList.add('active-nav');
            if(id === 'dashboard') renderAnalytics();
            if(id === 'history') updateHistory();
        }

        function notify(msg, type) {
            const t = document.getElementById('toast');
            const c = document.getElementById('toastContent');
            c.innerText = msg;
            c.className = `px-6 py-3 rounded-full font-black shadow-2xl text-sm text-white italic ${type==='success'?'bg-cyan-600':'bg-red-600'}`;
            t.style.opacity = '1'; t.style.transform = 'translateX(-50%) translateY(0)';
            setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(-20px)'; }, 2000);
        }

        function quickFill(n) { document.getElementById('saleLiters').value = (parseFloat(document.getElementById('saleLiters').value) || 0) + n; calculateSale(); }
        function adjValue(id, n) { let el = document.getElementById(id); let v = parseInt(el.value) + n; el.value = v < 0 ? 0 : v; calculateSale(); }
        function resetSystem() { if(confirm('TÜM VERİLER SİLİNECEK!')){ db.sales=[]; db.stock={tankWater:0, bottles5L:0, bottles10L:0}; syncCloud(); } }

        setInterval(() => {
            document.getElementById('dateDisplay').innerHTML = new Date().toLocaleString('tr-TR', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }, 1000);

        loadData();
    </script>
</body>
</html>
