<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>İNVER вода | Cloud Elite v7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        :root { --primary: #00d2ff; --secondary: #3a7bd5; --dark: #050b18; }
        body { 
            font-family: 'Outfit', sans-serif; 
            background: radial-gradient(circle at top right, #1e293b, #050b18);
            color: #e2e8f0; min-height: 100vh; margin: 0; overflow-x: hidden;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .active-nav {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.5); color: white !important;
        }
        .glow-text { text-shadow: 0 0 15px rgba(0, 210, 255, 0.6); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        /* Mobile/PC Optimization */
        @media (min-width: 768px) {
            .main-container { max-width: 1000px; margin: 0 auto; }
        }
    </style>
</head>
<body class="pb-28">

    <!-- Cloud Status Indicator -->
    <div id="cloudStatus" class="fixed top-2 right-4 text-[10px] font-bold uppercase tracking-widest z-[101]">
        <i class="fas fa-circle text-gray-500 mr-1"></i> Sync Offline
    </div>

    <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 z-[100] transition-all duration-500 opacity-0 pointer-events-none">
        <div id="toastContent" class="px-6 py-3 rounded-full font-bold shadow-2xl flex items-center gap-2 text-sm"></div>
    </div>

    <header class="p-6 flex flex-col items-center">
        <!-- Bayrak İkonları UI/UX -->
        <div class="flex gap-4 mb-4 text-xl">
            <span title="Turkish">🇹🇷</span><span title="Ukrainian">🇺🇦</span><span title="English">🇺🇸</span><span title="Russian">🇷🇺</span>
        </div>
        <h1 class="text-4xl font-extrabold tracking-tighter glow-text uppercase italic">İNVER <span class="text-cyan-400 font-light">вода</span></h1>
        <div id="dateDisplay" class="text-slate-400 text-[10px] mt-2 uppercase tracking-[0.2em] font-bold"></div>
    </header>

    <!-- ÜST ÖZET PANELİ -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 px-4 mb-8 max-w-6xl mx-auto">
        <div class="glass-card p-5 rounded-[2rem] border-b-4 border-cyan-500">
            <p class="text-[10px] uppercase text-slate-400 font-bold mb-1">Depo (Litre)</p>
            <h3 id="dash-tank" class="text-2xl font-black italic">... L</h3>
            <div class="w-full bg-slate-800 h-1.5 rounded-full mt-3 overflow-hidden">
                <div id="tankBar" class="bg-cyan-500 h-full transition-all duration-1000"></div>
            </div>
        </div>
        <div class="glass-card p-5 rounded-[2rem] border-b-4 border-green-500">
            <p class="text-[10px] uppercase text-slate-400 font-bold mb-1">Bugün Kâr</p>
            <h3 id="dash-profit" class="text-2xl font-black text-green-400 italic">0 ₴</h3>
        </div>
        <div class="glass-card p-5 rounded-[2rem] border-b-4 border-orange-500">
            <p class="text-[10px] uppercase text-slate-400 font-bold mb-1">Şişe (5L/10L)</p>
            <h3 id="dash-bottles" class="text-2xl font-black text-orange-400 italic">0/0</h3>
        </div>
        <div class="glass-card p-5 rounded-[2rem] border-b-4 border-blue-500">
            <p class="text-[10px] uppercase text-slate-400 font-bold mb-1">Toplam Ciro</p>
            <h3 id="dash-total" class="text-2xl font-black text-blue-400 italic">0 ₴</h3>
        </div>
    </div>

    <main class="px-4 main-container">
        <!-- SATIŞ EKRANI -->
        <section id="sales" class="content-section">
            <div class="glass-card p-8 rounded-[40px] border border-white/5">
                <div class="grid grid-cols-3 gap-3 mb-6">
                    <button onclick="quickFill(5)" class="bg-slate-800/60 p-4 rounded-2xl text-sm font-black hover:bg-cyan-500/20 active:scale-90 transition">+5L</button>
                    <button onclick="quickFill(10)" class="bg-slate-800/60 p-4 rounded-2xl text-sm font-black hover:bg-cyan-500/20 active:scale-90 transition">+10L</button>
                    <button onclick="quickFill(19)" class="bg-slate-800/60 p-4 rounded-2xl text-sm font-black hover:bg-cyan-500/20 active:scale-90 transition">+19L</button>
                </div>

                <div class="space-y-6">
                    <div class="relative">
                        <input type="number" id="saleLiters" oninput="calculateSale()" class="w-full bg-slate-900/80 p-6 rounded-3xl border-2 border-slate-800 text-5xl font-black focus:border-cyan-500 outline-none text-center glow-text" placeholder="0">
                        <span class="absolute right-8 top-1/2 -translate-y-1/2 text-slate-600 font-black text-2xl">L</span>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="bg-slate-900/40 p-4 rounded-3xl flex justify-between items-center border border-white/5">
                            <span class="text-xs text-slate-400 font-bold uppercase ml-2">5L Şişe Satış</span>
                            <div class="flex items-center gap-4">
                                <button onclick="adjBottle('sale5L', -1)" class="text-red-500 text-2xl"><i class="fas fa-minus-circle"></i></button>
                                <input type="number" id="sale5L" oninput="calculateSale()" class="bg-transparent w-10 text-center font-black text-2xl" value="0">
                                <button onclick="adjBottle('sale5L', 1)" class="text-green-500 text-2xl"><i class="fas fa-plus-circle"></i></button>
                            </div>
                        </div>
                        <div class="bg-slate-900/40 p-4 rounded-3xl flex justify-between items-center border border-white/5">
                            <span class="text-xs text-slate-400 font-bold uppercase ml-2">10L Şişe Satış</span>
                            <div class="flex items-center gap-4">
                                <button onclick="adjBottle('sale10L', -1)" class="text-red-500 text-2xl"><i class="fas fa-minus-circle"></i></button>
                                <input type="number" id="sale10L" oninput="calculateSale()" class="bg-transparent w-10 text-center font-black text-2xl" value="0">
                                <button onclick="adjBottle('sale10L', 1)" class="text-green-500 text-2xl"><i class="fas fa-plus-circle"></i></button>
                            </div>
                        </div>
                    </div>

                    <div class="p-6 bg-cyan-500/10 rounded-[30px] border border-cyan-500/30 text-center">
                        <p class="text-[10px] text-cyan-300 uppercase tracking-widest font-black mb-1">Net Ödeme Tutarı</p>
                        <h3 id="totalPriceDisplay" class="text-5xl font-black glow-text">0.00 ₴</h3>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <button onclick="completeSale('Nakit')" class="bg-green-600 hover:bg-green-500 py-5 rounded-2xl font-black shadow-lg active:scale-95 uppercase text-xs">NAKİT</button>
                        <button onclick="completeSale('Kart')" class="bg-blue-600 hover:bg-blue-500 py-5 rounded-2xl font-black shadow-lg active:scale-95 uppercase text-xs">KART (-1.3%)</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- DASHBOARD -->
        <section id="dashboard" class="content-section hidden space-y-6">
            <div class="glass-card p-6 rounded-[35px]">
                <h2 class="font-bold text-xs uppercase tracking-widest mb-6 italic">Haftalık Analiz</h2>
                <div class="h-64"><canvas id="mainChart"></canvas></div>
            </div>
            <div id="statCards" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
        </section>

        <!-- GEÇMİŞ -->
        <section id="history" class="content-section hidden">
            <div class="glass-card rounded-[35px] overflow-hidden">
                <div class="p-6 border-b border-white/5 flex justify-between items-center bg-white/5">
                    <h2 class="font-bold uppercase text-xs italic tracking-tighter">İşlem Kayıtları</h2>
                    <button onclick="downloadPDF()" class="bg-red-500 text-white text-[10px] px-4 py-2 rounded-full font-bold">PDF RAPOR</button>
                </div>
                <div class="overflow-x-auto max-h-[500px]">
                    <table class="w-full text-left">
                        <thead class="bg-slate-900 text-slate-500 text-[10px] uppercase font-black">
                            <tr>
                                <th class="p-4">Saat</th>
                                <th class="p-4">Detay</th>
                                <th class="p-4 text-center">Kâr</th>
                                <th class="p-4 text-right">Tutar</th>
                            </tr>
                        </thead>
                        <tbody id="historyTable" class="text-xs divide-y divide-white/5"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- AYARLAR -->
        <section id="settings" class="content-section hidden">
            <div class="glass-card p-8 rounded-[40px] space-y-8">
                <div>
                    <h2 class="font-black text-orange-400 uppercase text-xs mb-6 tracking-widest italic">Bulut Stok Yönetimi</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="bg-slate-900/60 p-4 rounded-2xl border border-white/5">
                            <label class="text-[9px] text-slate-500 uppercase font-black">Ana Tank (L)</label>
                            <input type="number" id="editTankWater" class="bg-transparent text-xl font-black w-full outline-none text-white mt-1">
                        </div>
                        <div class="bg-slate-900/60 p-4 rounded-2xl border border-white/5">
                            <label class="text-[9px] text-slate-500 uppercase font-black">5L Boş Şişe</label>
                            <input type="number" id="editBottles5L" class="bg-transparent text-xl font-black w-full outline-none text-white mt-1">
                        </div>
                        <div class="bg-slate-900/60 p-4 rounded-2xl border border-white/5">
                            <label class="text-[9px] text-slate-500 uppercase font-black">10L Boş Şişe</label>
                            <input type="number" id="editBottles10L" class="bg-transparent text-xl font-black w-full outline-none text-white mt-1">
                        </div>
                    </div>
                </div>
                <button onclick="saveGlobalSettings()" class="w-full bg-cyan-600 py-4 rounded-2xl font-black shadow-xl active:scale-95 transition-all text-xs uppercase tracking-widest">Verileri Buluta Senkronize Et</button>
            </div>
        </section>
    </main>

    <!-- ALT NAVİGASYON -->
    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[92%] max-w-sm glass-card rounded-[2.5rem] p-2 flex justify-around items-center z-50 border border-white/10 shadow-2xl">
        <button onclick="showSection('sales')" class="nav-btn active-nav w-14 h-14 rounded-full flex items-center justify-center"><i class="fas fa-tint"></i></button>
        <button onclick="showSection('dashboard')" class="nav-btn w-14 h-14 rounded-full flex items-center justify-center text-slate-500"><i class="fas fa-chart-line"></i></button>
        <button onclick="showSection('history')" class="nav-btn w-14 h-14 rounded-full flex items-center justify-center text-slate-500"><i class="fas fa-history"></i></button>
        <button onclick="showSection('settings')" class="nav-btn w-14 h-14 rounded-full flex items-center justify-center text-slate-500"><i class="fas fa-cog"></i></button>
    </nav>

    <audio id="cashSound" src="https://assets.mixkit.co/active_storage/sfx/2017/2017-preview.mp3"></audio>

    <script>
        const API_KEY = '$2a$10$QA58wc50wyQ3g8E9oqDNK./CTiaqIk0kjStY.wLOo4mUG9uZ7sQju';
        const BIN_ID = 'BURAYA_BIN_ID_YAZIN'; // jsonbin.io'dan aldığın ID

        let db = {
            settings: { priceLitre: 5, costLitre: 1.5, price5L: 20, cost5L: 12.0, price10L: 35, cost10L: 18.0, tankMax: 2000 },
            stock: { tankWater: 1500, bottles5L: 100, bottles10L: 50 },
            sales: []
        };

        async function loadCloudData() {
            updateStatus('loading');
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const data = await res.json();
                if(data.record) {
                    db = data.record;
                    renderUI();
                    updateStatus('online');
                }
            } catch (err) {
                updateStatus('offline');
                const local = localStorage.getItem('inver_backup');
                if(local) db = JSON.parse(local);
                renderUI();
            }
        }

        async function saveCloudData() {
            updateStatus('saving');
            localStorage.setItem('inver_backup', JSON.stringify(db));
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                    body: JSON.stringify(db)
                });
                updateStatus('online');
            } catch (err) {
                updateStatus('offline');
                notify("Hata: Buluta kaydedilemedi", "error");
            }
            renderUI();
        }

        function updateStatus(state) {
            const el = document.getElementById('cloudStatus');
            const map = {
                online: '<i class="fas fa-circle text-green-500 mr-1"></i> Sync Online',
                saving: '<i class="fas fa-sync fa-spin text-cyan-500 mr-1"></i> Saving...',
                loading: '<i class="fas fa-cloud-download-alt text-blue-500 mr-1"></i> Loading...',
                offline: '<i class="fas fa-exclamation-triangle text-red-500 mr-1"></i> Sync Offline'
            };
            el.innerHTML = map[state];
        }

        function calculateSale() {
            const l = parseFloat(document.getElementById('saleLiters').value) || 0;
            const b5 = parseInt(document.getElementById('sale5L').value) || 0;
            const b10 = parseInt(document.getElementById('sale10L').value) || 0;
            const total = (l * db.settings.priceLitre) + (b5 * db.settings.price5L) + (b10 * db.settings.price10L);
            document.getElementById('totalPriceDisplay').innerText = total.toFixed(2) + ' ₴';
        }

        function quickFill(n) {
            let el = document.getElementById('saleLiters');
            el.value = (parseFloat(el.value) || 0) + n;
            calculateSale();
        }

        function adjBottle(id, n) {
            let el = document.getElementById(id);
            let val = parseInt(el.value) + n;
            el.value = val < 0 ? 0 : val;
            calculateSale();
        }

        function completeSale(method) {
            const l = parseFloat(document.getElementById('saleLiters').value) || 0;
            const b5 = parseInt(document.getElementById('sale5L').value) || 0;
            const b10 = parseInt(document.getElementById('sale10L').value) || 0;

            if(l + b5 + b10 === 0) return;
            if(db.stock.tankWater < l) return notify("Yetersiz su!", "error");

            const gross = (l * db.settings.priceLitre) + (b5 * db.settings.price5L) + (b10 * db.settings.price10L);
            const comm = method === 'Kart' ? (gross * 0.013) : 0;
            const net = gross - comm;
            const cost = (l * db.settings.costLitre) + (b5 * db.settings.cost5L) + (b10 * db.settings.cost10L);

            db.sales.push({
                date: new Date().toISOString(),
                liters: l, b5, b10, gross, net, profit: net - cost, method
            });

            db.stock.tankWater -= l;
            db.stock.bottles5L -= b5;
            db.stock.bottles10L -= b10;

            document.getElementById('cashSound').play();
            document.getElementById('saleLiters').value = '';
            document.getElementById('sale5L').value = 0;
            document.getElementById('sale10L').value = 0;
            calculateSale();
            saveCloudData();
            notify("İşlem Tamamlandı");
        }

        function renderUI() {
            document.getElementById('dash-tank').innerText = Math.floor(db.stock.tankWater) + ' L';
            document.getElementById('dash-bottles').innerText = `${db.stock.bottles5L}/${db.stock.bottles10L}`;
            document.getElementById('tankBar').style.width = (db.stock.tankWater / db.settings.tankMax * 100) + '%';

            const today = new Date().toLocaleDateString();
            const todaySales = db.sales.filter(s => new Date(s.date).toLocaleDateString() === today);
            document.getElementById('dash-profit').innerText = todaySales.reduce((a,b)=>a+b.profit,0).toFixed(1) + ' ₴';
            document.getElementById('dash-total').innerText = db.sales.reduce((a,b)=>a+b.net,0).toFixed(0) + ' ₴';

            document.getElementById('editTankWater').value = Math.floor(db.stock.tankWater);
            document.getElementById('editBottles5L').value = db.stock.bottles5L;
            document.getElementById('editBottles10L').value = db.stock.bottles10L;
        }

        function saveGlobalSettings() {
            db.stock.tankWater = parseFloat(document.getElementById('editTankWater').value);
            db.stock.bottles5L = parseInt(document.getElementById('editBottles5L').value);
            db.stock.bottles10L = parseInt(document.getElementById('editBottles10L').value);
            saveCloudData();
            notify("Bulut Stoğu Güncellendi");
        }

        function showSection(id) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-nav'));
            event.currentTarget.classList.add('active-nav');
            if(id === 'dashboard') renderChart();
            if(id === 'history') updateHistory();
        }

        function updateHistory() {
            const html = db.sales.slice().reverse().map(s => `
                <tr class="hover:bg-white/5">
                    <td class="p-4 text-slate-500">${new Date(s.date).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</td>
                    <td class="p-4">${s.liters}L ${s.b5>0 ? '+'+s.b5+'x5' : ''}</td>
                    <td class="p-4 text-center text-green-400 font-bold">${s.profit.toFixed(1)}</td>
                    <td class="p-4 text-right font-black ${s.method==='Kart'?'text-blue-400':'text-cyan-400'}">${s.net.toFixed(1)}</td>
                </tr>
            `).join('');
            document.getElementById('historyTable').innerHTML = html || '<tr><td colspan="4" class="p-10 text-center italic opacity-30">Veri yok</td></tr>';
        }

        function notify(msg, type='success') {
            const toast = document.getElementById('toast');
            document.getElementById('toastContent').className = `px-6 py-3 rounded-full font-bold ${type==='success'?'bg-cyan-500':'bg-red-500'} text-white`;
            document.getElementById('toastContent').innerText = msg;
            toast.style.opacity = '1';
            setTimeout(()=> toast.style.opacity = '0', 2000);
        }

        let chart;
        function renderChart() {
            const ctx = document.getElementById('mainChart').getContext('2d');
            if(chart) chart.destroy();
            const labels = []; const data = [];
            for(let i=6; i>=0; i--) {
                const d = new Date(); d.setDate(d.getDate()-i);
                labels.push(d.toLocaleDateString().slice(0,5));
                data.push(db.sales.filter(s => new Date(s.date).toLocaleDateString() === d.toLocaleDateString()).reduce((a,b)=>a+b.liters, 0));
            }
            chart = new Chart(ctx, {
                type: 'line',
                data: { labels, datasets: [{ data, borderColor: '#00d2ff', backgroundColor: 'rgba(0, 210, 255, 0.1)', fill: true, tension: 0.4 }] },
                options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' } } } }
            });
        }

        setInterval(() => {
            document.getElementById('dateDisplay').innerHTML = new Date().toLocaleString('tr-TR', { 
                weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit'
            });
        }, 1000);

        loadCloudData();
    </script>
</body>
</html>
